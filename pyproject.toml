[project]
name = "supermimic-yai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joreb", email = "joseph.rebeirro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.3.5", "gymnasium", "trimesh", "manifold3d", "coacd",
    "imageio", "imageio-ffmpeg", "pyyaml", "numpy", "python-fcl", "scipy",
    "torch==2.8.0", "tensorboard==2.20.0",  # torch: pip install --index-url https://download.pytorch.org/whl/cu126 (PyPI's is cu128, no sm_61); see Dockerfile
]

[project.scripts]
supermimic = "supermimic_yai.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["slow: long-running tests"]
addopts = "-m 'not slow'"
