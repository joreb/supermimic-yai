# Laptop scale (GTX 1050, 7 GB RAM). workers: null -> min(4, cpu_count).
action_scale: 0.25   # rad per unit learner action at 10 Hz (= 0.05 at 50 Hz, same rad/s; ruling P3)
collect: {workers: null, envs_per_worker: 4, action_noise: [0.0, 0.05, 0.1]}
replay: {capacity: 400000}
policy: {z_dim: 32, width: 512, depth: 3, lr: 2.0e-4, betas: [0.9, 0.95], grad_clip: 1.0, grad_clip_elem: 0.1, gamma: 0.99, horizon: 32, batch: 1024, bc_iters: 2000, std_floor: 1.0e-3}
critic: {width: 256, depth: 2, lam: 0.95, epochs: 5, minibatches: 4}
wm: {width: 512, depth: 3, k: 8, batch: 2048, lr: 2.0e-4, grad_clip: 1.0}
train: {episodes_per_iter: 64, min_updates: 20, max_updates: 400, lr_decay_iters: 20000, log_every: 10, eval_every: 50, eval_n: 30, eval_recipe_seeds: 10, video_every: 200, ckpt_every: 50}
